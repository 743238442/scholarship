<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 神影视频</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa fa-film"></i> 神影视频
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">电影</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">电视剧</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">动漫</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">综艺</a>
                    </li>
                </ul>
                <!-- 搜索框 -->
                <form class="d-flex me-3">
                    <input class="form-control me-2" type="search" placeholder="搜索电影、电视剧..." aria-label="Search">
                    <button class="btn btn-primary" type="submit">
                        <i class="fa fa-search"></i>
                    </button>
                </form>
                <!-- 登录/注册按钮 -->
                <div class="d-flex">
                    <a href="login.html" class="btn btn-light me-2">登录</a>
                    <a href="register.html" class="btn btn-primary active">注册</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <div class="container mt-5">
        <div class="form-container">
            <h2 class="form-title">用户注册</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required minlength="3" maxlength="20">
                    </div>
                    <div class="invalid-feedback">
                        用户名长度必须在3-20个字符之间
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">邮箱</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="请输入邮箱地址" required>
                    </div>
                    <div class="invalid-feedback">
                        请输入有效的邮箱地址
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="phone" class="form-label">手机号码 <span class="text-muted">(可选)</span></label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-phone"></i>
                        </span>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入手机号码" pattern="^1[3-9]\d{9}$">
                    </div>
                    <div class="invalid-feedback">
                        请输入有效的手机号码
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required minlength="6">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">
                        密码长度不能少于6个字符
                    </div>
                    <div class="form-text">
                        密码至少包含6个字符，建议使用字母、数字和符号的组合
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                    </div>
                    <div class="invalid-feedback">
                        两次输入的密码不一致
                    </div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="agreeTerms" name="agreeTerms" required>
                    <label class="form-check-label" for="agreeTerms">
                        我已阅读并同意 <a href="#" class="text-primary">《用户协议》</a> 和 <a href="#" class="text-primary">《隐私政策》</a>
                    </label>
                    <div class="invalid-feedback">
                        请阅读并同意用户协议和隐私政策
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="fa fa-user-plus"></i> 注册账号
                </button>
                
                <div class="mt-3 text-center">
                    <p>已有账号？ <a href="login.html" class="text-primary">立即登录</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-center py-3 border-top border-secondary">
        <div class="container">
            <div class="footer-links">
                <a href="#" class="text-white me-4">关于我们</a>
                <span class="text-light">|</span>
                <a href="#" class="text-white mx-4">联系我们</a>
                <span class="text-light">|</span>
                <a href="#" class="text-white mx-4">网站地图</a>
                <span class="text-light">|</span>
                <a href="admin/index.html" class="text-white ms-4">后台管理</a>
            </div>
            <div class="mt-2 text-sm text-light">
                <p class="mb-0">作者：软件工程（专升本）A 梁敏诗</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义脚本 -->
    <script src="js/main.js"></script>
    <script>
        // 表单验证
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const togglePasswordBtn = document.getElementById('togglePassword');
            
            // 密码显示/隐藏功能
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                confirmPasswordInput.setAttribute('type', type);
                
                // 切换图标
                const icon = togglePasswordBtn.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
            
            // 密码确认验证
            confirmPasswordInput.addEventListener('input', function() {
                if (passwordInput.value !== confirmPasswordInput.value) {
                    confirmPasswordInput.setCustomValidity('两次输入的密码不一致');
                } else {
                    confirmPasswordInput.setCustomValidity('');
                }
            });
            
            // 表单提交处理
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 手动触发验证
                if (registerForm.checkValidity()) {
                    // 模拟注册请求
                    const formData = new FormData(registerForm);
                    const userData = Object.fromEntries(formData);
                    
                    console.log('注册信息:', userData);
                    
                    // 显示成功提示
                    alert('注册成功！欢迎使用神影视频！');
                    
                    // 跳转到登录页
                    window.location.href = 'login.html';
                } else {
                    // 滚动到第一个错误的表单字段
                    const firstInvalidField = registerForm.querySelector(':invalid');
                    firstInvalidField.focus();
                }
            });
            
            // 实时验证用户名
            const usernameInput = document.getElementById('username');
            usernameInput.addEventListener('input', function() {
                const username = this.value;
                const usernameRegex = /^[a-zA-Z0-9_]{3,20}$/;
                
                if (username && !usernameRegex.test(username)) {
                    this.setCustomValidity('用户名只能包含字母、数字和下划线');
                } else {
                    this.setCustomValidity('');
                }
            });
            
            // 实时验证邮箱
            const emailInput = document.getElementById('email');
            emailInput.addEventListener('input', function() {
                const email = this.value;
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                
                if (email && !emailRegex.test(email)) {
                    this.setCustomValidity('请输入有效的邮箱地址');
                } else {
                    this.setCustomValidity('');
                }
            });
            
            // 实时验证手机号码
            const phoneInput = document.getElementById('phone');
            phoneInput.addEventListener('input', function() {
                const phone = this.value;
                const phoneRegex = /^1[3-9]\d{9}$/;
                
                if (phone && !phoneRegex.test(phone)) {
                    this.setCustomValidity('请输入有效的手机号码');
                } else {
                    this.setCustomValidity('');
                }
            });
        });
    </script>
</body>
</html>

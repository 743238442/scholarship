<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 神影视频</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa fa-film"></i> 神影视频
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">电影</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">电视剧</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">动漫</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">综艺</a>
                    </li>
                </ul>
                <!-- 搜索框 -->
                <form class="d-flex me-3">
                    <input class="form-control me-2" type="search" placeholder="搜索电影、电视剧..." aria-label="Search">
                    <button class="btn btn-primary" type="submit">
                        <i class="fa fa-search"></i>
                    </button>
                </form>
                <!-- 登录/注册按钮 -->
                <div class="d-flex">
                    <a href="login.html" class="btn btn-light me-2">登录</a>
                    <a href="register.html" class="btn btn-primary">注册</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <div class="container mt-5">
        <div class="form-container">
            <h2 class="form-title">用户登录</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginUsername" class="form-label">用户名或邮箱</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="loginUsername" name="username" placeholder="请输入用户名或邮箱" required>
                    </div>
                    <div class="invalid-feedback">
                        请输入用户名或邮箱
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label for="loginPassword" class="form-label">密码</label>
                        
                    </div>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="loginPassword" name="password" placeholder="请输入密码" required minlength="6">
                        <button class="btn btn-outline-secondary" type="button" id="toggleLoginPassword">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">
                        密码长度不能少于6个字符
                    </div>
                </div>
                
                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">记住我</label>
                    </div>
                    <a href="#" class="text-primary">忘记密码？</a>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="fa fa-sign-in"></i> 登录
                </button>
                
                <div class="mt-3 text-center">
                    <p>还没有账号？ <a href="register.html" class="text-primary">立即注册</a></p>
                </div>
                
                <!-- 第三方登录 -->
                <div class="mt-4">
                    <div class="text-center mb-3">
                        <span class="text-muted">或使用以下方式登录</span>
                    </div>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="#" class="btn btn-outline-primary btn-lg" style="min-width: 120px;">
                            <i class="fa fa-weibo"></i> 微博
                        </a>
                        <a href="#" class="btn btn-outline-success btn-lg" style="min-width: 120px;">
                            <i class="fa fa-wechat"></i> 微信
                        </a>
                        <a href="#" class="btn btn-outline-info btn-lg" style="min-width: 120px;">
                            <i class="fa fa-qq"></i> QQ
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-center py-3 border-top border-secondary">
        <div class="container">
            <div class="footer-links">
                <a href="#" class="text-white me-4">关于我们</a>
                <span class="text-light">|</span>
                <a href="#" class="text-white mx-4">联系我们</a>
                <span class="text-light">|</span>
                <a href="#" class="text-white mx-4">网站地图</a>
                <span class="text-light">|</span>
                <a href="admin/index.html" class="text-white ms-4">后台管理</a>
            </div>
            <div class="mt-2 text-sm text-light">
                <p class="mb-0">作者：软件工程（专升本）A 梁敏诗</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义脚本 -->
    <script src="js/main.js"></script>
    <script>
        // 登录表单验证
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const passwordInput = document.getElementById('loginPassword');
            const togglePasswordBtn = document.getElementById('toggleLoginPassword');
            
            // 密码显示/隐藏功能
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // 切换图标
                const icon = togglePasswordBtn.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
            
            // 表单提交处理
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 手动触发验证
                if (loginForm.checkValidity()) {
                    // 模拟登录请求
                    const formData = new FormData(loginForm);
                    const loginData = Object.fromEntries(formData);
                    
                    console.log('登录信息:', loginData);
                    
                    // 检查是否是管理员账号
                    if (loginData.username === 'admin' && loginData.password === 'admin123') {
                        alert('管理员登录成功！');
                        // 跳转到后台管理页面
                        window.location.href = 'admin/index.html';
                    } else {
                        // 普通用户登录
                        alert('登录成功！欢迎回到神影视频！');
                        // 跳转到首页
                        window.location.href = 'index.html';
                    }
                } else {
                    // 滚动到第一个错误的表单字段
                    const firstInvalidField = loginForm.querySelector(':invalid');
                    firstInvalidField.focus();
                }
            });
        });
    </script>
</body>
</html>
